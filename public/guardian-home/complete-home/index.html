const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state={room:0,decor:[0,0,0],night:[false,false,false],sound:false};try{const v=JSON.parse(localStorage.getItem('guardianHomeDemoV1'));if(v&&[0,1,2].includes(v.room))state={...state,...v}}catch{}const names=['森林木屋','雲端小屋','星空觀景艙'];let bubbleTimer,moveTimer,fxTimer,ctx;const pet=$('.pet'),panel=$('#panel');function save(){try{localStorage.setItem('guardianHomeDemoV1',JSON.stringify(state))}catch{}}function tone(){if(!state.sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[523,659,784].forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=freq;const t=ctx.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)})}catch{}}function say(t){clearTimeout(bubbleTimer);$('.bubble').textContent=t;$('.bubble').classList.add('show');bubbleTimer=setTimeout(()=>$('.bubble').classList.remove('show'),4500)}function hearts(){for(let i=0;i<5;i++){let e=document.createElement('span');e.className='spark';e.textContent=['♥','✦','♥'][i%3];e.style.cssText=`left:${35+Math.random()*30}%;top:${57+Math.random()*9}%;color:${i%2?'#fff0ad':'#ffd2c6'}`;$('.stage').append(e);setTimeout(()=>e.remove(),1700)}}function resetPet(){clearTimeout(moveTimer);clearTimeout(fxTimer);pet.className='pet';$('.bed').textContent='☾ 去睡窩'}function happy(text){resetPet();pet.classList.add('happy');say(text);hearts();tone();fxTimer=setTimeout(()=>pet.classList.remove('happy'),1400)}function render(){document.title=names[state.room]+' · 互動試玩';$('#title').textContent=names[state.room];$('.room').style.backgroundPosition=`${state.room*50}% 50%`;$('.stage').classList.toggle('night',!!state.night[state.room]);$('.decor').hidden=!state.decor[state.room];$('.decor').textContent=['','✨','🌿','💎'][state.decor[state.room]
